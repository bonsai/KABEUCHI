research:
  title: "KABEUCHI 既存サービス調査"
  date: "2026-09-26"
  purpose: "音声壁打ち・リサーチ・企画編集サービスの既存事例調査"
  services:
    - name: "ChatGPT Voice"
      category: "voice_conversation"
      role: "話す"
      kabeuchi_use: "音声壁打ちの入口"
    - name: "Gemini Live"
      category: "voice_conversation"
      role: "話す"
      kabeuchi_use: "Google Workspace連携を含む音声体験の参考"
    - name: "Claude"
      category: "conversation"
      role: "考える"
      kabeuchi_use: "長文脈の思考整理・企画壁打ち"
    - name: "Perplexity"
      category: "research"
      role: "調べる"
      kabeuchi_use: "検索と会話を統合したリサーチ体験"
    - name: "Gemini Notebook"
      former_name: "NotebookLM"
      category: "source_grounded_research"
      role: "資料を読む"
      kabeuchi_use: "資料を根拠にした編集者向け対話"
    - name: "ElevenLabs Agents"
      category: "voice_agent"
      role: "音声エージェント"
      kabeuchi_use: "音声エージェントとツール連携の参考"
    - name: "Vapi"
      category: "voice_gateway"
      role: "音声ゲートウェイ"
      kabeuchi_use: "音声→LLM→外部APIの接続設計"
    - name: "Retell AI"
      category: "voice_agent"
      role: "会話フロー"
      kabeuchi_use: "リアルタイム音声会話の設計参考"
    - name: "Google Drive / Docs"
      category: "storage"
      role: "残す"
      kabeuchi_use: "企画書・リサーチ・会話成果物の保存先"
    - name: "GitHub"
      category: "knowledge_and_versioning"
      role: "育てる"
      kabeuchi_use: "Intent→Prompt→Workflow→Issue→成果物の管理"
  synthesis:
    existing_functions:
      - "話す"
      - "調べる"
      - "資料を読む"
      - "音声エージェント"
      - "保存する"
      - "バージョン管理"
    kabeuchi_unique_layer:
      - "Intent抽出"
      - "質問生成"
      - "回答によるIntent更新"
      - "次の質問選択"
      - "7問グリル"
      - "企画への構造化"
    core_loop:
      - "発話"
      - "Intent"
      - "Prompt"
      - "質問"
      - "回答"
      - "状態更新"
      - "次のIntent"
      - "成果物化"
      - "保存"
    first_use_case:
      name: "出版企画7問グリル"
      input: "音声"
      output:
        - "企画概要"
        - "想定読者"
        - "著者の強み"
        - "差別化"
        - "章立て"
        - "次に考えること"
    ux:
      visible_actions:
        - "話す"
        - "調べる"
        - "残す"
    principle: "既存AIを再発明せず、編集者が使える入口と対話設計を作る"
